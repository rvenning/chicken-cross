<meta charset="utf-8" />
<meta name="gk-version" content="30" data-date="2026-09-19" data-kit="1.10.1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Chicken Cross" />
<meta name="theme-color" content="#1c2a33" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<title>Chicken Cross</title>
<link rel="stylesheet" href="lib/gk-base.css" />
<link rel="stylesheet" href="css/style.css" id="css-new">
<link rel="stylesheet" href="css/legacy.css" id="css-classic" disabled>
<link rel="stylesheet" href="css/settings.css">
<script>
  // Pick the stylesheet before first paint, from the look this device last used.
  try { if (localStorage.getItem("cc_look") === "classic") {
    document.getElementById("css-new").disabled = true;
    document.getElementById("css-classic").disabled = false;
  } } catch (e) {}
</script>

<canvas id="c"></canvas>

<!-- ============ SPLASH ============ -->
<div class="screen opaque active" id="screen-splash">
  <div class="splash-inner">
    <canvas id="hero" class="hero" width="264" height="244" aria-hidden="true"></canvas>
    <h1 class="title">Chicken Cross</h1>
    <p class="subtitle">Dodge cars, ride logs, beat the trains!</p>
    <div class="content" style="text-align:center">
      <!-- shown when this device has a last player: one-tap continue -->
      <button class="btn green wide" id="btn-continue-as" style="display:none"></button>
      <button class="btn green wide" id="btn-play" onclick="App.play()">▶ Play</button>
      <button class="btn blue wide" onclick="App.showLeaderboard()">🏆 High Scores</button>
      <!-- shown by the PWA script only when the app is installable and not yet installed -->
      <button class="btn grey wide" id="btn-install" style="display:none">📲 Add to Home Screen</button>
      <p style="opacity:.85;font-size:14px;margin-top:18px">
        Move: Arrow keys / WASD · Swipe or tap on touch
      </p>
      <p style="opacity:.6;font-size:13px;margin-top:6px"><span id="sync-badge">⏳ connecting…</span></p>
    </div>
  </div>
</div>

<!-- ============ PROFILES ============ -->
<div class="screen opaque" id="screen-profiles">
  <div class="topbar">
    <button class="iconbtn" onclick="App.showScreen('splash')" aria-label="Back">⬅</button>
    <div class="grow"></div>
    <button class="iconbtn btn-sound" aria-label="Toggle sound">🔊</button>
  </div>
  <h1 class="title" style="font-size:32px;margin-top:6px">Who's playing?</h1>
  <div class="content"><div class="profile-list" id="profile-list"></div></div>
</div>

<!-- ============ MAP ============ -->
<div class="screen opaque" id="screen-map">
  <div class="topbar">
    <button class="iconbtn" onclick="App.play()" aria-label="Back to players">⬅</button>
    <div class="player-chip" id="map-player"></div>
    <div class="grow"></div>
    <button class="iconbtn" onclick="App.showLeaderboard()" aria-label="High scores">🏆</button>
    <button class="iconbtn btn-sound" aria-label="Toggle sound">🔊</button>
    <button class="iconbtn" onclick="App.openSettings()" aria-label="Settings">⚙️</button>
  </div>
  <div class="content">
    <button class="btn blue wide" id="btn-endless" onclick="App.startEndless()">♾️ Endless Run</button>
    <div id="world-list"></div>
  </div>
</div>

<!-- ============ LEADERBOARD ============ -->
<div class="screen opaque" id="screen-leaderboard">
  <div class="topbar">
    <button class="iconbtn" id="lb-back" aria-label="Back">⬅</button>
    <div class="grow"></div>
  </div>
  <h1 class="title" style="font-size:32px">🏆 High Scores</h1>
  <div class="content"><div id="lb-rows"></div></div>
</div>

<!-- ============ GAME ============ -->
<div class="screen game" id="screen-game">
  <div id="gbar">
    <button class="iconbtn" onclick="Game.exitToMap()" aria-label="Quit to map">⬅</button>
    <div class="pill" id="g-progress">0</div>
    <div class="grow" style="flex:1"></div>
    <div class="pill" id="g-coins">🪙 0</div>
    <button class="iconbtn" onclick="Game.pause()" aria-label="Pause">⏸</button>
  </div>
</div>

<!-- ============ MODALS ============ -->
<!-- profile/PIN/delete + iOS-install modals are injected by gamekit -->
<div class="modal" id="result-modal">
  <div class="sheet" id="result-sheet"></div>
</div>

<div class="modal" id="pause-modal">
  <div class="sheet">
    <h2>⏸ Paused</h2>
    <div class="row-btns2">
      <button class="btn grey" onclick="Game.exitToMap()">🗺️ Quit</button>
      <button class="btn green" onclick="Game.resume()">▶ Resume</button>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="sheet settings-sheet">
    <h2>⚙️ Settings</h2>
    <h3 id="view-label">View</h3>
    <div class="seg" role="group" aria-labelledby="view-label">
      <button data-view="2d" aria-pressed="false">🗺️ 2D<small>flat, from above</small></button>
      <button data-view="3d" aria-pressed="false">🧊 3D<small>blocky world</small></button>
    </div>
    <h3 id="look-label">Look <span class="note" id="look-note">· 2D only</span></h3>
    <div class="seg" role="group" aria-labelledby="look-label">
      <button data-look="new" aria-pressed="false">✨ New<small>detailed worlds</small></button>
      <button data-look="classic" aria-pressed="false">🕹️ Classic<small>the original look</small></button>
    </div>
    <h3 id="bird-label">Character</h3>
    <div class="bird-grid" id="bird-grid" role="radiogroup" aria-labelledby="bird-label"></div>
    <button class="btn green wide" onclick="App.closeSettings()">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="lib/gk-util.js"></script>
<script src="lib/gk-audio.js"></script>
<script src="lib/gk-ui.js"></script>
<script src="lib/gk-storage.js"></script>
<script src="lib/gk-profiles.js"></script>
<script src="lib/gk-pwa.js"></script>
<script src="lib/gk-fx.js"></script>
<script src="lib/gk-debug.js"></script>

<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/art.js"></script>
<script src="js/render.js"></script>
<script src="js/render-legacy.js"></script>
<script src="js/render3d.js"></script>
<script src="js/main.js"></script>
